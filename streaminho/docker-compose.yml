services:
  postgres:
    image: postgres:17
    container_name: streaming-postgres

    environment:
      POSTGRES_DB: streaming_db
      POSTGRES_USER: streaminho
      POSTGRES_PASSWORD: streaminho

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: